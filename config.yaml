# Please use ABSOLUTE PATH for all file paths
#Location of the container image SPRITE.sif
container: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/SPRITE.sif"
#Location of the config file for barcodeIdentification
bID: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/Test_Files/config.txt"
#Location of the samples json file produced with fastq2json.py script
samples: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/samples.json"
#output directory
output_dir: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/"
#root directory for the scripts
scripts_dir: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/Scripts/scripts/"
#Bowtie2 assembly type
assembly: "hg38"
#Number of barcodes used
num_tags: "5"
#Repeat mask used for filtering DNA contacts
mask:
    hg38: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/References/hg38_blacklist_rmsk.milliDivLessThan140.bed.gz"
#Bowtie2 indexes location with prefix
bowtie2_index:
    hg38: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/References/index/GRCh38.primary_assembly.genome"
#Adapter data for cudadapt
adapter: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/References/dpm96.fasta"
#Setting for mating heatmap matrix
#Plot a chromosome 'chr1' or plot genome wide 'genome'
chromosome:
    - genome
# Options 'none', 'n_minus_one', 'two_over_n'
downweighting:
    - two_over_n
#Number of ICE iterations 
ice_iterations:
    - 100
#Contact matrix resolution in bp
resolution:
    - 1000000
min_cluster_size:
    - 2
max_cluster_size:
    - 1000
#Max value for heatmap plotting
max_value:
    - 255

# Report generation settings
report_config:
  script: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/Scripts/compile_report.py"
  generate_html: true
  html_template: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/Scripts/SPRITE_Report.html"
  generate_markdown: true
  markdown_template: "/mnt1/4.NAS2025/zhangam/easyomics_test/report/SPRITE/Scripts/SPRITE_Report.md"
  report_title: "SPRITE Analysis Report"
  institution: "Your Institution"
  pi_name: ""
  project_id: ""
  analysis_date: ""
  show_contact_map: true
  heatmap_resolution: 1000000